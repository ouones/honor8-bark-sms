
# /data/adb/modules/hyperos_sms_forwarder/core/config.conf

# ================= 1. 核心推送设置 =================
# 【必填】你的钉钉机器人 Webhook 地址 (直接填完整的URL即可)
WEBHOOK_URL=""

# ================= 2. 功能开关 (true 为开启，false 为关闭) =================
ENABLE_SMS="true"             # 开启短信转发
ENABLE_MISSED_CALL="true"     # 开启未接来电转发
ENABLE_INCOMING_CALL="false"  # 开启已接电话转发 (按需开启)
ENABLE_OUTGOING_CALL="false"  # 开启拨出电话转发 (按需开启)


# ================= 3. 展现名称设置 =================
# 这里的名字你可以随便改！因为脚本已经在底层给你加了“通知”二字当通行证，
# 所以这里填什么钉钉都不会拦截了，完全看你自己的排版喜好。
KEYWORD_SMS="【短信】"
KEYWORD_MISSED="【未接来电】"
KEYWORD_INCOMING="【已接来电】"
KEYWORD_OUTGOING="【拨出电话】"


# ================= 4. 系统环境适配 =================
# 你的手机系统类型。
# 如果是 一加/OPPO，必须严格填写 ColorOS
# 如果是 小米/红米，可以填 HyperOS 或 MIUI
OS_TYPE="ColorOS"


# ================= 5. 高级运行参数 (建议保持默认) =================
# 轮询间隔时间 (秒)。设置 5 秒能在推送及时性和省电之间达到最佳平衡。
INTERVAL=5

# 日志最大体积 (KB)。超过 1MB (1024KB) 后脚本会自动备份清理，绝对不会占用手机存储。
MAX_LOG_SIZE_KB=1024

# 临时文件存放目录 (安卓标准临时缓存区)
TMP_DIR="/data/local/tmp"